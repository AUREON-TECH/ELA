name: verify

on:
  push:
    branches:
      - feat/ela-fase-a
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check js/app.js
          node --check js/state.js
          node --check js/cycle.js
          node --check js/diary.js
          node --check js/agenda.js
          node --check js/self-care.js
          node --check js/insights.js
          node --check sw.js
      - name: Run tests
        run: node --test tests/*.test.mjs
