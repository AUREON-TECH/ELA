name: ELA PWA Audit

on:
  push:
    branches: [main, pwa-bootstrap]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run PWA audit
        run: node scripts/pwa-audit.mjs
