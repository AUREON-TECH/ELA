<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#d81b60"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><title>ELA • Agenda</title><link rel="manifest" href="./manifest.webmanifest"><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:linear-gradient(160deg,#fff0f6,#f3e5f5);color:#42162f}.app{max-width:760px;margin:auto;padding:14px}.hero{background:linear-gradient(135deg,#e91e63,#8e24aa,#ff7043);color:#fff;padding:24px;border-radius:28px}.card{background:#fff;border-radius:22px;padding:18px;margin:14px 0}input{width:100%;padding:12px;border:1px solid #f2bfd1;border-radius:14px;margin:6px 0 10px;font:inherit}.btn{display:block;width:100%;border:0;border-radius:14px;padding:12px;background:#d81b60;color:#fff;font-weight:800;text-align:center;text-decoration:none;margin-top:8px}.item{padding:12px 0;border-bottom:1px solid #f7d6e3}.item-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.small-btn{border:0;border-radius:12px;padding:8px 10px;font-weight:800;cursor:pointer;background:#f3e5f5;color:#6a173e}.remove{background:#fff0f6;color:#a31550}.done{opacity:.58}.done .event-text{text-decoration:line-through}.overdue{border-left:4px solid #ff7043;padding-left:10px}.small{font-size:13px;opacity:.72}</style></head><body><main class="app"><div class="hero"><h1>Agenda 📅</h1><p>Organize compromissos com data e horário.</p></div><section class="card"><label>Data</label><input id="date" type="date"><label>Horário opcional</label><input id="time" type="time"><label>Compromisso</label><input id="text" maxlength="160" placeholder="Consulta, treino, autocuidado..."><button class="btn" id="add">Adicionar</button><p id="status" class="small"></p></section><section class="card"><h2>Próximos</h2><div id="list" class="small"></div></section><section class="card"><h2>Precisam de atenção</h2><p class="small">Compromissos cujo dia ou horário já passou e ainda não foram concluídos.</p><div id="overdue" class="small"></div></section><section class="card"><h2>Concluídos</h2><div id="completed" class="small"></div></section><a class="btn" href="./index.html">← Voltar ao ELA</a></main><script>const K='ela-pwa-v2';const state=JSON.parse(localStorage.getItem(K)||'{}');const byId=id=>document.getElementById(id);const today=new Date().toISOString().slice(0,10);byId('date').value=today;function save(){localStorage.setItem(K,JSON.stringify(state))}state.events=state.events||[];let migrated=false;state.events=state.events.map((e,i)=>{if(e.id)return e;migrated=true;return{...e,id:'evt-old-'+i+'-'+e.date,completed:false}});if(migrated)save();function eventAt(e){if(!e.date)return null;const d=new Date(e.date+'T'+(e.time||'23:59')+':00');return Number.isNaN(d.getTime())?null:d}function isPast(e){const at=eventAt(e);return at?at<new Date():false}function removeEvent(id){if(!confirm('Excluir este compromisso?'))return;state.events=state.events.filter(e=>e.id!==id);save();byId('status').textContent='Compromisso excluído.';render()}function toggleEvent(id){const e=state.events.find(x=>x.id===id);if(!e)return;e.completed=!e.completed;e.completedAt=e.completed?new Date().toISOString():null;save();byId('status').textContent=e.completed?'Compromisso concluído ✓':'Compromisso reaberto.';render()}function eventNode(e,isOverdue=false){const item=document.createElement('div');item.className='item'+(e.completed?' done':'')+(isOverdue?' overdue':'');const row=document.createElement('div');row.className='item-row';const info=document.createElement('div');const when=document.createElement('b');when.textContent=(isOverdue?'⚠️ ':'📅 ')+e.date.split('-').reverse().join('/')+(e.time?' · '+e.time:'');const text=document.createElement('div');text.className='event-text';text.textContent=e.text;info.append(when,text);const actions=document.createElement('div');actions.className='actions';const toggle=document.createElement('button');toggle.className='small-btn';toggle.type='button';toggle.textContent=e.completed?'Reabrir':'Concluir';toggle.onclick=()=>toggleEvent(e.id);const remove=document.createElement('button');remove.className='small-btn remove';remove.type='button';remove.textContent='Excluir';remove.onclick=()=>removeEvent(e.id);actions.append(toggle,remove);row.append(info,actions);item.appendChild(row);return item}function render(){const list=byId('list'),overdue=byId('overdue'),completed=byId('completed');list.textContent='';overdue.textContent='';completed.textContent='';const active=state.events.filter(e=>!e.completed&&!isPast(e)).sort((a,b)=>(eventAt(a)?.getTime()||Infinity)-(eventAt(b)?.getTime()||Infinity));const late=state.events.filter(e=>!e.completed&&isPast(e)).sort((a,b)=>(eventAt(b)?.getTime()||0)-(eventAt(a)?.getTime()||0));const done=state.events.filter(e=>e.completed).sort((a,b)=>(b.completedAt||'').localeCompare(a.completedAt||'')).slice(0,10);if(!active.length)list.textContent='Nenhum compromisso.';else active.forEach(e=>list.appendChild(eventNode(e)));if(!late.length)overdue.textContent='Tudo em dia ✓';else late.forEach(e=>overdue.appendChild(eventNode(e,true)));if(!done.length)completed.textContent='Nenhum compromisso concluído.';else done.forEach(e=>completed.appendChild(eventNode(e)))}byId('add').onclick=()=>{const date=byId('date').value,time=byId('time').value,text=byId('text').value.trim();if(!date||!text){byId('status').textContent='Informe a data e o compromisso.';return}state.events.push({id:'evt-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),date,time,text,completed:false});save();byId('text').value='';byId('time').value='';byId('status').textContent='Compromisso salvo ✓';render()};render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(r=>r.update().catch(()=>{})).catch(()=>{});</script></body></html>
