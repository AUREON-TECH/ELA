<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#d81b60"><title>ELA • Agenda</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:linear-gradient(160deg,#fff0f6,#f3e5f5);color:#42162f}.app{max-width:760px;margin:auto;padding:14px}.hero{background:linear-gradient(135deg,#e91e63,#8e24aa,#ff7043);color:#fff;padding:24px;border-radius:28px}.card{background:#fff;border-radius:22px;padding:18px;margin:14px 0}input{width:100%;padding:12px;border:1px solid #f2bfd1;border-radius:14px;margin:6px 0 10px;font:inherit}.btn{display:block;width:100%;border:0;border-radius:14px;padding:12px;background:#d81b60;color:#fff;font-weight:800;text-align:center;text-decoration:none;margin-top:8px}.item{padding:12px 0;border-bottom:1px solid #f7d6e3}.small{font-size:13px;opacity:.72}</style></head><body><main class="app"><div class="hero"><h1>Agenda 📅</h1><p>Organize compromissos com data e horário.</p></div><section class="card"><label>Data</label><input id="date" type="date"><label>Horário opcional</label><input id="time" type="time"><label>Compromisso</label><input id="text" maxlength="160" placeholder="Consulta, treino, autocuidado..."><button class="btn" id="add">Adicionar</button><p id="status" class="small"></p></section><section class="card"><h2>Próximos</h2><div id="list" class="small"></div></section><a class="btn" href="./index.html">← Voltar ao ELA</a></main><script>const K='ela-pwa-v2';const state=JSON.parse(localStorage.getItem(K)||'{}');const byId=id=>document.getElementById(id);const today=new Date().toISOString().slice(0,10);byId('date').value=today;function save(){localStorage.setItem(K,JSON.stringify(state))}function render(){const list=byId('list');list.textContent='';const events=(state.events||[]).filter(e=>e.date>=today).sort((a,b)=>(a.date+(a.time||'99:99')).localeCompare(b.date+(b.time||'99:99')));if(!events.length){list.textContent='Nenhum compromisso.';return}events.forEach(e=>{const item=document.createElement('div');item.className='item';const when=document.createElement('b');when.textContent='📅 '+e.date.split('-').reverse().join('/')+(e.time?' · '+e.time:'');const text=document.createElement('div');text.textContent=e.text;item.append(when,text);list.appendChild(item)})}byId('add').onclick=()=>{const date=byId('date').value,time=byId('time').value,text=byId('text').value.trim();if(!date||!text){byId('status').textContent='Informe a data e o compromisso.';return}state.events=state.events||[];state.events.push({date,time,text});save();byId('text').value='';byId('time').value='';byId('status').textContent='Compromisso salvo ✓';render()};render();</script></body></html>
