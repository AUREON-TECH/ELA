<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#d81b60"><title>ELA • Calendário</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:linear-gradient(160deg,#fff0f6,#f3e5f5);color:#42162f}.app{max-width:760px;margin:auto;padding:16px}.hero{background:linear-gradient(135deg,#e91e63,#8e24aa,#ff7043);color:#fff;padding:22px;border-radius:26px}.card{background:#fff;border-radius:22px;padding:16px;margin-top:14px;box-shadow:0 8px 25px #6d214f14}.head{display:flex;align-items:center;justify-content:space-between;gap:8px}.head button,.back{border:0;border-radius:14px;padding:10px 13px;background:#f8bbd0;color:#6a173e;font-weight:800;text-decoration:none}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.week{margin:16px 0 7px;text-align:center;font-size:12px;font-weight:800;opacity:.65}.day{min-height:68px;border-radius:14px;padding:7px;background:#fff7fa;border:1px solid #f5d8e4;position:relative}.day.other{opacity:.3}.day.today{outline:2px solid #8e24aa}.num{font-weight:900}.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin:3px 2px 0}.menstrual{background:#e91e63}.fertile{background:#8e24aa}.ovulation{background:#ff7043}.tpm{background:#f4a261}.event{background:#3f51b5}.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px}.legend span{display:flex;align-items:center;gap:4px}.empty{font-size:13px;opacity:.7}@media(max-width:520px){.app{padding:10px}.day{min-height:58px;padding:5px}.hero{padding:18px}}</style></head><body><main class="app"><div class="hero"><a class="back" href="./index.html">← Voltar ao ELA</a><h1>Calendário do ciclo 🌷</h1><p>Visualize menstruação, janela fértil, ovulação, TPM e compromissos.</p></div><section class="card"><div class="head"><button id="prev">‹</button><h2 id="title"></h2><button id="next">›</button></div><div class="week"><span>Dom</span><span>Seg</span><span>Ter</span><span>Qua</span><span>Qui</span><span>Sex</span><span>Sáb</span></div><div class="days" id="days"></div></section><section class="card"><div class="legend"><span><i class="dot menstrual"></i>Menstruação</span><span><i class="dot fertile"></i>Fértil</span><span><i class="dot ovulation"></i>Ovulação</span><span><i class="dot tpm"></i>TPM</span><span><i class="dot event"></i>Agenda</span></div><p class="empty">As fases são estimativas baseadas nos dados registrados e não devem ser usadas como método contraceptivo ou diagnóstico.</p></section></main><script>const state=JSON.parse(localStorage.getItem('ela-pwa-v2')||localStorage.getItem('ela-pwa-v1')||'{}');let cursor=new Date();cursor.setDate(1);const pad=n=>String(n).padStart(2,'0'),key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,daysBetween=(a,b)=>Math.floor((a-b)/86400000);function cycleDay(d){if(!state.lastPeriod)return null;const start=new Date(state.lastPeriod+'T12:00:00'),x=new Date(d.getFullYear(),d.getMonth(),d.getDate(),12);const diff=daysBetween(x,start);if(diff<0)return null;const len=+state.cycleLength||28;return(diff%len)+1}function marks(d){const out=[],n=cycleDay(d),len=+state.cycleLength||28,period=+state.periodLength||5,ov=Math.max(1,len-14);if(n){if(n<=period)out.push('menstrual');if(n>=ov-5&&n<=ov+1)out.push('fertile');if(n===ov)out.push('ovulation');if(n>=len-4)out.push('tpm')}if((state.events||[]).some(e=>e.date===key(d)))out.push('event');return out}function render(){const y=cursor.getFullYear(),m=cursor.getMonth(),names=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];document.getElementById('title').textContent=names[m][0].toUpperCase()+names[m].slice(1)+' '+y;const first=new Date(y,m,1),last=new Date(y,m+1,0),start=new Date(y,m,1-first.getDay()),end=new Date(y,m,last.getDate()+(6-last.getDay())),today=key(new Date());let html='';for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){const ks=key(d),other=d.getMonth()!==m,ms=marks(d);html+=`<div class="day${other?' other':''}${ks===today?' today':''}"><div class="num">${d.getDate()}</div><div>${ms.map(x=>`<i class="dot ${x}"></i>`).join('')}</div></div>`}document.getElementById('days').innerHTML=html}document.getElementById('prev').onclick=()=>{cursor.setMonth(cursor.getMonth()-1);render()};document.getElementById('next').onclick=()=>{cursor.setMonth(cursor.getMonth()+1);render()};render();</script></body></html>
