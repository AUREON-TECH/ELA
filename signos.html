<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#d81b60"><title>ELA • Signo do dia</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:linear-gradient(160deg,#fff0f6,#f3e5f5);color:#42162f}.app{max-width:760px;margin:auto;padding:14px}.hero{background:linear-gradient(135deg,#e91e63,#8e24aa,#ff7043);color:#fff;padding:24px;border-radius:28px}.card{background:#fff;border-radius:22px;padding:18px;margin:14px 0;box-shadow:0 8px 25px #6d214f14}select{width:100%;padding:13px;border:1px solid #f2bfd1;border-radius:14px;font:inherit;background:#fff}.btn,.back{display:block;width:100%;border:0;border-radius:14px;padding:12px;background:linear-gradient(135deg,#d81b60,#8e24aa);color:#fff;font-weight:800;text-align:center;text-decoration:none;margin-top:10px}.message{font-size:21px;font-weight:800;line-height:1.4}.small{font-size:13px;opacity:.7}.tag{display:inline-block;padding:6px 10px;border-radius:999px;background:#fff0f6;font-weight:800;margin:4px 4px 0 0}</style></head><body><main class="app"><div class="hero"><h1>Seu signo ✨</h1><p>Uma mensagem diária de autocuidado para acompanhar o seu momento.</p></div><section class="card"><label for="signo"><b>Meu signo</b></label><select id="signo"><option value="">Escolha</option><option>Áries</option><option>Touro</option><option>Gêmeos</option><option>Câncer</option><option>Leão</option><option>Virgem</option><option>Libra</option><option>Escorpião</option><option>Sagitário</option><option>Capricórnio</option><option>Aquário</option><option>Peixes</option></select><button class="btn" id="save">Salvar signo</button></section><section class="card" id="daily"><div class="small">MENSAGEM DO DIA</div><p class="message">Escolha seu signo para personalizar este espaço.</p></section><a class="back" href="./index.html">← Voltar ao ELA</a><p class="small">As mensagens de signo são conteúdo de bem-estar e entretenimento; não são previsões factuais nem orientação médica.</p></main><script>const K='ela-pwa-v2',state=JSON.parse(localStorage.getItem(K)||localStorage.getItem('ela-pwa-v1')||'{}'),sel=document.getElementById('signo'),box=document.getElementById('daily');if(!state.zodiac&&state.signo){state.zodiac=state.signo;delete state.signo;localStorage.setItem(K,JSON.stringify(state))}sel.value=state.zodiac||'';const messages=['Hoje vale respeitar o seu próprio ritmo. Nem tudo precisa ser resolvido de uma vez.','Observe o que seu corpo está pedindo antes de preencher o dia com obrigações.','Sua energia merece direção, mas também descanso. Escolha uma prioridade real para hoje.','Um pequeno cuidado consigo pode mudar o tom do dia inteiro.','Você não precisa sentir tudo da mesma forma todos os dias. Perceber suas mudanças também é autoconhecimento.','Reserve alguns minutos para algo que faça você se sentir presente no próprio corpo.','Hoje, troque cobrança por curiosidade: como você realmente está se sentindo?','Se a energia estiver baixa, ajuste o ritmo. Se estiver alta, use-a no que importa.','Seu bem-estar também é construído nas pequenas escolhas que ninguém vê.','Escute seus limites com a mesma atenção que você dá às suas metas.','Registre como você está hoje. Com o tempo, seus próprios padrões contam uma história.','Faça algo gentil por você antes de terminar o dia.'];function render(){if(!state.zodiac){box.innerHTML='<div class="small">MENSAGEM DO DIA</div><p class="message">Escolha seu signo para personalizar este espaço.</p>';return}const date=new Date(),seed=(date.getFullYear()*372+(date.getMonth()+1)*31+date.getDate()+state.zodiac.length*17)%messages.length;box.innerHTML=`<div class="small">${state.zodiac.toUpperCase()} · MENSAGEM DO DIA</div><p class="message">${messages[seed]}</p><span class="tag">✨ autocuidado</span><span class="tag">🌷 seu momento</span>`}document.getElementById('save').onclick=()=>{state.zodiac=sel.value;delete state.signo;localStorage.setItem(K,JSON.stringify(state));render()};render();</script></body></html>
