<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#d81b60"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><title>ELA • Signo do dia</title><link rel="manifest" href="./manifest.webmanifest"><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:linear-gradient(160deg,#fff0f6,#f3e5f5);color:#42162f}.app{max-width:760px;margin:auto;padding:14px}.hero{background:linear-gradient(135deg,#e91e63,#8e24aa,#ff7043);color:#fff;padding:24px;border-radius:28px}.card{background:#fff;border-radius:22px;padding:18px;margin:14px 0;box-shadow:0 8px 25px #6d214f14}select{width:100%;padding:13px;border:1px solid #f2bfd1;border-radius:14px;font:inherit;background:#fff}.btn,.back{display:block;width:100%;border:0;border-radius:14px;padding:12px;background:linear-gradient(135deg,#d81b60,#8e24aa);color:#fff;font-weight:800;text-align:center;text-decoration:none;margin-top:10px}.message{font-size:21px;font-weight:800;line-height:1.4}.small{font-size:13px;opacity:.7}.tag{display:inline-block;padding:6px 10px;border-radius:999px;background:#fff0f6;font-weight:800;margin:4px 4px 0 0}</style></head><body><main class="app"><div class="hero"><h1>Seu signo ✨</h1><p>Uma mensagem diária de autocuidado para acompanhar o seu momento.</p></div><section class="card"><label for="signo"><b>Meu signo</b></label><select id="signo"><option value="">Escolha</option><option>Áries</option><option>Touro</option><option>Gêmeos</option><option>Câncer</option><option>Leão</option><option>Virgem</option><option>Libra</option><option>Escorpião</option><option>Sagitário</option><option>Capricórnio</option><option>Aquário</option><option>Peixes</option></select><button class="btn" id="save">Salvar signo</button></section><section class="card" id="daily"><div class="small">MENSAGEM DO DIA</div><p class="message">Escolha seu signo para personalizar este espaço.</p></section><a class="back" href="./index.html">← Voltar ao ELA</a><p class="small">As mensagens de signo são conteúdo de bem-estar e entretenimento; não são previsões factuais nem orientação médica.</p></main><script>const K='ela-pwa-v2',state=JSON.parse(localStorage.getItem(K)||localStorage.getItem('ela-pwa-v1')||'{}'),sel=document.getElementById('signo'),box=document.getElementById('daily');if(!state.zodiac&&state.signo){state.zodiac=state.signo;delete state.signo;localStorage.setItem(K,JSON.stringify(state))}sel.value=state.zodiac||'';const profiles={'Áries':['Use sua iniciativa no que realmente importa hoje.','Sua força cresce quando você também respeita a pausa.','Direcione sua energia para uma prioridade de cada vez.'],'Touro':['Conforto também pode ser uma forma de cuidado consciente.','Respeite seu ritmo e perceba o que traz estabilidade.','Hoje, valorize o simples que faz seu corpo se sentir bem.'],'Gêmeos':['Organize os pensamentos antes de tentar abraçar tudo.','Uma conversa leve pode renovar o seu dia.','Dê espaço à curiosidade sem esquecer de descansar a mente.'],'Câncer':['Acolha suas emoções sem precisar explicá-las imediatamente.','Seu espaço de conforto merece atenção hoje.','Cuide de si com a mesma delicadeza que oferece aos outros.'],'Leão':['Reconheça algo em você que merece orgulho hoje.','Sua presença não precisa provar nada para ter valor.','Use sua energia criativa em algo que faça você se sentir viva.'],'Virgem':['Nem tudo precisa estar perfeito para estar bem.','Transforme cobrança em um pequeno cuidado possível.','Organize o essencial e deixe espaço para respirar.'],'Libra':['Escolha o que traz equilíbrio sem se esquecer de você.','Um limite gentil também protege sua paz.','Hoje, procure beleza nas pequenas pausas do dia.'],'Escorpião':['Observe o que você sente antes de tentar controlar o momento.','Sua intensidade também merece descanso e suavidade.','Deixe ir uma cobrança que já não precisa acompanhar você.'],'Sagitário':['Movimento faz bem, mas presença dá sentido ao caminho.','Escolha hoje algo que desperte entusiasmo sem esgotar você.','Abra espaço para uma pequena novidade no seu dia.'],'Capricórnio':['Descansar também faz parte de construir o que importa.','Reconheça o que já avançou antes de pensar na próxima meta.','Faça o essencial com constância e trate-se com menos cobrança.'],'Aquário':['Uma ideia diferente pode nascer quando você desacelera.','Respeite seu jeito próprio de sentir e organizar o dia.','Dê espaço para algo criativo sem transformar tudo em obrigação.'],'Peixes':['Proteja sua sensibilidade com momentos de silêncio e cuidado.','Perceba suas emoções sem carregar tudo que está ao redor.','Hoje, escolha algo que ajude você a voltar para si.']};function render(){if(!state.zodiac){box.innerHTML='<div class="small">MENSAGEM DO DIA</div><p class="message">Escolha seu signo para personalizar este espaço.</p>';return}const date=new Date(),messages=profiles[state.zodiac]||['Hoje, respeite seu próprio ritmo.'],seed=(date.getFullYear()*372+(date.getMonth()+1)*31+date.getDate())%messages.length;box.innerHTML=`<div class="small">${state.zodiac.toUpperCase()} · MENSAGEM DO DIA</div><p class="message">${messages[seed]}</p><span class="tag">✨ autocuidado</span><span class="tag">🌷 seu momento</span>`}document.getElementById('save').onclick=()=>{state.zodiac=sel.value;delete state.signo;localStorage.setItem(K,JSON.stringify(state));render()};render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(r=>r.update().catch(()=>{}));</script></body></html>
